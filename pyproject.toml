[project]
name = "ai-usage-check"
version = "0.1.0"
description = "Check remaining Codex, Claude Code, GitHub Copilot, Antigravity CLI, and Grok usage"
requires-python = ">=3.9"

[project.scripts]
ai-usage = "usage_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["usage_check.py"]
